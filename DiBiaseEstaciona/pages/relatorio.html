<!doctype html>
<html lang="pt-Br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/relatorio.css" />
  <link rel="stylesheet" href="../css/components/navbar.css" />
  <link rel="stylesheet" href="../css/components/sidebar.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <title>Relátorio</title>
</head>

<body>
  <nav>
    <h1>DiBiase Estaciona</h1>
    <img src="../assets/images/logoUGB.png" class="navbar-logo" />
    <img
        src="../assets/images/menu-aberto.png"
        class="menu-icon"
        id="menu-icon"
    />
  </nav>

  <div class="layout">
    <aside class="sidebar">
      <div class="top-side">
        <div class="menu dashboard">
          <a href="./dashboard.html" class="link-side text-dashboard">
            Dashboard
          </a>
        </div>

        <div class="menu controle-veiculos">
          <a href="./control.html" class="link-side">
            Controle de veiculos
          </a>
        </div>

        <div class="menu entradas-saidas">
          <a href="./entryexit.html" class="link-side"> Entradas e saídas </a>
        </div>

        <div class="menu relatorios">
          <a href="./relatorio.html" class="link-side"> Relatórios </a>
        </div>
        <div class="menu gestao" id="menu-usuarios">
          <a href="./usuarios.html" class="link-side"> Gestão de Usuários </a>
        </div>
      </div>
      <div class="side-footer" id="side-footer">
        <div class="img-side-footer">
          <img src="../assets/images/userIcon.png" alt="" class="userLogo" />
        </div>

        <div class="user-sidebar">
          <h3 id="userName"></h3>
          <p id="UserRole"></p>
        </div>

        <div class="side-footer-menu" id="side-footer-menu">
          <a href="" id="logout">Sair</a>
        </div>
      </div>
    </aside>
    <main class="content">
      <div class="inner_content">
        <div class="fields">
          <div class="search_bar">
            <div class="search">
              <input id="dataInicial" type="date" onchange="aplicarFiltros()" placeholder="DD - MM - AAAA" />
              <label>Data Inicial</label>
            </div>

            <div class="search">
              <select id="periodo" aria-placeholder="Período" onchange="aplicarFiltros()">
                <option value="">Todos os períodos</option>
                <option value="manha">Manhã (06:00 - 12:00)</option>
                <option value="tarde">Tarde (12:00 - 18:00)</option>
                <option value="noite">Noite (18:00 - 06:00)</option>
              </select>
              <label>Período</label>
            </div>

            <div class="search">
              <input id="dataFinal" type="date" onchange="aplicarFiltros()" placeholder="DD - MM - AAAA" />
              <label>Data Final</label>
            </div>

            <div class="search">
              <input id="buscaPlaca" type="text" placeholder="Buscar por placa" onkeyup="aplicarFiltros()" />
            </div>
          </div>

          <div class="buttons">
            <div class="filter-buttons">
              <button class="todos" id="todos" onclick="todos()">
                Todos
              </button>
              <button class="estacionado" id="estacionado" onclick="estacionado()">
                Estacionado
              </button>
              <button class="ausente" id="ausente" onclick="ausente()">
                Ausente
              </button>
            </div>

            <button class="add" id="exportarCSV">Gerar Relatório</button>
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>PLACA</th>
                <th>TIPO</th>
                <th>DATA DE REGISTRO</th>
                <th>PERMANÊCIA</th>
              </tr>
            </thead>
            <tbody id="table-controle"></tbody>
          </table>
          <div class="pages">
            <button onclick="anterior()"><i class="fa-solid fa-arrow-left"></i> Anterior</button>
            <span id="pagina">1</span>
            <button onclick="proxima()">Próxima <i class="fa-solid fa-arrow-right"></i></button>
            <span id="exibion"></span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="../js/components.js"></script>
  <script type="module" src="../js/relatorio.js"></script>
</body>

</html>
