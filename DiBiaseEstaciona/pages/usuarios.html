<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        if (!localStorage.getItem('token')) {
            window.location.replace('../pages/login.html')
        }   
        if (localStorage.getItem('role') !== 'admin') {
            window.location.replace('../pages/dashboard.html')
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/usuarios.css" />
    <link rel="stylesheet" href="../css/components/navbar.css" />
    <link rel="stylesheet" href="../css/components/sidebar.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <title>Gestão de Usuários</title>
</head>

<body>
    <nav>
        <h1>DiBiase Estaciona</h1>
        <img src="../assets/images/logoUGB.png" class="navbar-logo">
        <img
        src="../assets/images/menu-aberto.png"
        class="menu-icon"
        id="menu-icon"
        />
    </nav>

    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <div class="top-side">
                <div class="menu dashboard">
                    <a href="./dashboard.html" class="link-side">
                        Dashboard
                    </a>
                </div>

                <div class="menu controle-veiculos">
                    <a href="./control.html" class="link-side">
                        Controle de veiculos
                    </a>
                </div>

                <div class="menu entradas-saidas">
                    <a href="./entryexit.html" class="link-side">
                        Entradas e saídas
                    </a>
                </div>

                <div class="menu relatorios">
                    <a href="./relatorio.html" class="link-side">
                        Relatórios
                    </a>
                </div>

                <div class="menu gestao" id="menu-usuarios">
                    <a href="./usuarios.html" class="link-side">
                        Gestão de Usuários
                    </a>
                </div>
            </div>
            <div class="side-footer" id="side-footer">
                <div class="img-side-footer">
                    <img src="../assets/images/userIcon.png" alt="" class="userLogo">
                </div>

                <div class="user-sidebar">
                    <h3 id="userName"></h3>
                    <p id="UserRole"></p>
                </div>

                <div class="side-footer-menu" id="side-footer-menu">
                    <a href="" id="logout">Sair</a>
                </div>
            </div>
        </aside>
        <div class="content">
            <div class="inner_content">
                <div class="header_users">
                    <div class="search_container">
                        <input type="text" class="search_input" placeholder="Buscar usuário">
                    </div>
                    <button class="btn_create" onclick="create()">
                        Cadastrar Usuário
                    </button>
                </div>
                <div class="table_container">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>MATRÍCULA</th>
                                <th>USUÁRIO</th>
                                <th>FUNÇÃO</th>
                                <th>AÇÕES</th>
                            </tr>
                        </thead>
                        <tbody id="table-user"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div class="overlay" id="overlay"></div>
    <div class="popup" id="popup">
        <div class="popup_header">
            <div class="popup_title">
                <h2>Cadastrar usuário</h2>
                <p>Insira as informações do usuário</p>
            </div>
            <button class="fechar" onclick="fechar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="campos">
            <div class="campo">
                <label for="email">Email do usuário</label>
                <input type="text" name="email" id="email" placeholder="Digite o email do usuário">
            </div>
            <div class="campo">
                <label for="matricula">Matricula</label>
                <input type="text" name="matricula" id="matricula" placeholder="Digite a matrícula do usuário">
            </div>
            <div class="campo">
                <label for="role">Função</label>
                 <select name="role" id="role">
                    <option value="colaborador">Colaborador</option>
                    <option value="admin">Administrador</option>
                 </select>
            </div>
            <button id="cadastrar" onclick="cadastrar()">Cadastrar</button>
        </div>
    </div>
    <div class="popup" id="popup-editar">
        <div class="popup_header">
            <div class="popup_title">
                <h2>Editar Veículos</h2>
                <p>Insira as informações do veículos e do condutor</p>
            </div>
            <button class="fechar" onclick="fechar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="campos">
            <div class="campo">
                <label for="email">Email do condutor</label>
                <input type="text" name="nome" id="email-edit" placeholder="Digite o nome do condutor">
            </div>
            <div class="campo">
                <label for="matricula">Matricula</label>
                <input type="text" name="matricula" id="matricula-edit" placeholder="Digite a matrícula do condutor">
            </div>
            <div class="campo">
                <label for="role">Função</label>
                 <select name="role" id="role-edit">
                    <option value="colaborador">Colaborador</option>
                    <option value="admin">Administrador</option>
                 </select>
            </div>
            <button id="cadastrar" onclick="editar()">Editar</button>
        </div>
    </div>


    <script src="../js/components.js"></script>
    <script type="module" src="../js/user.js"></script>
</body>

</html>
