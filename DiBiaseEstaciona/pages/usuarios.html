<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/usuarios.css" />
    <link rel="stylesheet" href="../css/components/navbar.css" />
    <link rel="stylesheet" href="../css/components/sidebar.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <title>Gestão de Usuários</title>
</head>

<body>
    <nav>
        <h1>DiBiase Estaciona</h1>
        <img src="../assets/images/logoUGB.png" class="navbar-logo">
    </nav>

    <div class="layout">
        <aside class="sidebar">
            <div class="top-side">
                <div class="menu dashboard">
                    <a href="./dashboard.html" class="link-side">
                        Dashboard
                    </a>
                </div>

                <div class="menu controle-veiculos">
                    <a href="./control.html" class="link-side">
                        Controle de veiculos
                    </a>
                </div>

                <div class="menu entradas-saidas">
                    <a href="./entryexit.html" class="link-side">
                        Entradas e saídas
                    </a>
                </div>

                <div class="menu relatorios">
                    <a href="./relatorio.html" class="link-side">
                        Relatórios
                    </a>
                </div>

                <div class="menu gestao">
                    <a href="./usuarios.html" class="link-side">
                        Gestão de Usuários
                    </a>
                </div>
            </div>
            <div class="side-footer" id="side-footer">
                <div class="img-side-footer">
                    <img src="../assets/images/userIcon.png" alt="" class="userLogo">
                </div>

                <div class="user-sidebar">
                    <h3 id="userName"></h3>
                    <p id="UserRole"></p>
                </div>

                <div class="side-footer-menu" id="side-footer-menu">
                    <a href="" id="logout">Sair</a>
                </div>
            </div>
        </aside>
        <div class="content">
            <div class="inner_content">
                <div class="header_users">
                    <div class="search_container">
                        <input type="text" class="search_input" placeholder="Buscar usuário">
                    </div>
                    <button class="btn_create" onclick="create()">
                        Cadastrar Usuário
                    </button>
                </div>
                <div class="table_container">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>MATRÍCULA</th>
                                <th>USUÁRIO</th>
                                <th>FUNÇÃO</th>
                                <th>AÇÕES</th>
                            </tr>
                        </thead>
                        <tbody id="table-user"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div class="popup" id="popup">
        <button onclick="fechar()"><i class="fa-solid fa-xmark"></i></button>
        <div class="popup_content">
            <div class="text">
                <h4>Cadastro Veículos</h4>
                <p>Insira as informações do veículos e do condutor</p>
            </div>
            <div class="campos">
                <div class="campo">
                    <label for="email">Email do condutor</label>
                    <input type="text" name="email" id="email" placeholder="Digite o email do condutor">
                </div>
                <div class="campo">
                    <label for="matricula">Matricula</label>
                    <input type="text" name="matricula" id="matricula" placeholder="Digite a matrícula do condutor">
                </div>
                <div class="campo">
                    <label for="role">Função</label>
                    <input type="text" name="role" id="role" placeholder="">
                    <button id="cadastrar" onclick="cadastrar()">Cadastrar</button>
                </div>
            </div>
        </div>
    </div>
    <div class="popupedit" id="popup-editar">
        <button class="fechar" onclick="fechar()"><i class="fa-solid fa-xmark"></i></button>
        <div class="popup_content">
            <div class="text">
                <h4>Editar Veículos</h4>
                <p>Insira as informações do veículos e do condutor</p>
            </div>
            <div class="campos">
                <div class="campo">
                    <label for="email">Email do condutor</label>
                    <input type="text" name="nome" id="email-edit" placeholder="Digite o nome do condutor">
                </div>
                <div class="campo">
                    <label for="matricula">Matricula</label>
                    <input type="text" name="matricula" id="matricula-edit"
                        placeholder="Digite a matrícula do condutor">
                </div>
                <div class="campo">
                    <label for="role">Função</label>
                    <input type="text" name="role" id="role-edit" placeholder="">
                    <button id="editar" onclick="editar()">editar</button>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="../js/components.js"></script>
    <script type="module" src="../js/user.js"></script>
</body>
</html>
