<!doctype html>
<html lang="pt-Br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/entryexit.css" />
    <link rel="stylesheet" href="../css/components/navbar.css" />
    <link rel="stylesheet" href="../css/components/sidebar.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <title>Entrada e saída</title>
  </head>

  <body>
    <nav>
      <h1>DiBiase Estaciona</h1>
      <img src="../assets/images/logoUGB.png" class="navbar-logo" />
    </nav>

    <div class="layout">
      <aside class="sidebar">
        <div class="top-side">
          <div class="menu dashboard">
            <a href="./dashboard.html" class="link-side text-dashboard">
              Dashboard
            </a>
          </div>

          <div class="menu controle-veiculos">
            <a href="./control.html" class="link-side">
              Controle de veiculos
            </a>
          </div>

          <div class="menu entradas-saidas">
            <a href="./entryexit.html" class="link-side"> Entradas e saídas </a>
          </div>

          <div class="menu relatorios">
            <a href="./relatorio.html" class="link-side"> Relatórios </a>
          </div>

          <div class="menu gestao">
            <a href="./usuarios.html" class="link-side"> Gestão de Usuários </a>
          </div>
        </div>
        <div class="side-footer" id="side-footer">
          <div class="img-side-footer">
            <img src="../assets/images/userIcon.png" alt="" class="userLogo" />
          </div>

          <div class="user-sidebar">
            <h3 id="userName"></h3>
            <p id="UserRole"></p>
          </div>

          <div class="side-footer-menu" id="side-footer-menu">
            <a href="" id="logout">Sair</a>
          </div>
        </div>
      </aside>
      <main class="content">
        <div class="inner_content">
          <div class="fields">
            <div class="search_bar">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input
                type="text"
                id="pesquisa"
                onkeydown="if (event.key === 'Enter') pesquisar();"
                placeholder="Buscar por placa..."
              />
            </div>
            <div class="buttons">
              <div class="table-buttons">
                <button class="todos" id="todos" onclick="todos()">
                  Todos
                </button>
                <button class="entrada" id="entrada" onclick="entrada()">
                  Entrada
                </button>
                <button class="saida" id="saida" onclick="saida()">
                  Saída
                </button>
              </div>

              <div class="nova-mov">
                <button class="add" onclick="add()">Nova movimentação</button>
              </div>
            </div>
          </div>

          <div class="content_title">
            <h2 class="titulo">Movimentações de hoje</h2>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>PLACA</th>
                  <th>HORÁRIO DE REGISTRO</th>
                  <th>TIPO</th>
                  <th>PERMANÊCIA</th>
                  <th>STATUS</th>
                  <th>IMAGEM</th>
                </tr>
              </thead>
              <tbody id="table-controle"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="../js/components.js"></script>
    <script type="module" src="../js/entryexit.js"></script>
  </body>
</html>
