<!doctype html>
<html lang="pt-Br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/entryexit.css" />
    <link rel="stylesheet" href="../css/components/navbar.css" />
    <link rel="stylesheet" href="../css/components/sidebar.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <title>Entrada e saída</title>
  </head>

  <body>
    <nav>
      <h1>DiBiase Estaciona</h1>
      <img src="../assets/images/logoUGB.png" class="navbar-logo" />
      <img
        src="../assets/images/menu-aberto.png"
        class="menu-icon"
        id="menu-icon"
      />
    </nav>

    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="top-side">
          <div class="menu dashboard">
            <a href="./dashboard.html" class="link-side text-dashboard">
              Dashboard
            </a>
          </div>

          <div class="menu controle-veiculos">
            <a href="./control.html" class="link-side">
              Controle de veiculos
            </a>
          </div>

          <div class="menu entradas-saidas">
            <a href="./entryexit.html" class="link-side"> Entradas e saídas </a>
          </div>

          <div class="menu relatorios">
            <a href="./relatorio.html" class="link-side"> Relatórios </a>
          </div>

          <div class="menu gestao">
            <a href="./usuarios.html" class="link-side"> Gestão de Usuários </a>
          </div>
        </div>
        <div class="side-footer" id="side-footer">
          <div class="img-side-footer">
            <img src="../assets/images/userIcon.png" alt="" class="userLogo" />
          </div>

          <div class="user-sidebar">
            <h3 id="userName"></h3>
            <p id="UserRole"></p>
          </div>

          <div class="side-footer-menu" id="side-footer-menu">
            <a href="" id="logout">Sair</a>
          </div>
        </div>
      </aside>
      <main class="content">
        <div class="inner_content">
          <div class="fields">
            <div class="search_bar">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input
                type="text"
                id="pesquisa"
                onkeydown="if (event.key === 'Enter') pesquisar();"
                placeholder="Buscar por placa..."
              />
            </div>
            <div class="buttons">
              <div class="table-buttons">
                <button class="todos" id="todos" onclick="todos()">
                  Todos
                </button>
                <button class="entrada" id="entrada" onclick="entrada()">
                  Entrada
                </button>
                <button class="saida" id="saida" onclick="saida()">
                  Saída
                </button>
              </div>

              <div class="nova-mov">
                <button class="add" onclick="abrirModal()">
                  Nova movimentação
                </button>
              </div>
            </div>
          </div>

          <div class="content_title">
            <h2 class="titulo">Movimentações de hoje</h2>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>PLACA</th>
                  <th>HORÁRIO DE REGISTRO</th>
                  <th>TIPO</th>
                  <th>PERMANÊCIA</th>
                  <th>STATUS</th>
                  <th>IMAGEM</th>
                </tr>
              </thead>
              <tbody id="table-controle"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <!-- MODAL -->
    <div
      id="modal-overlay"
      class="modal-overlay"
      onclick="fecharModalFora(event)"
    >
      <div class="modal-card">
        <div class="modal-header">
          <div>
            <h2 class="modal-title">Nova movimentação</h2>
            <p class="modal-subtitle">Preencha os dados do veículo</p>
          </div>
          <button class="modal-close" onclick="fecharModal()">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div class="tipo-toggle">
          <button
            id="btn-entrada"
            class="tipo-btn tipo-ativo-entrada"
            onclick="selecionarTipo('entrada')"
          >
            <i class="fa-solid fa-arrow-down"></i> Entrada
          </button>
          <button
            id="btn-saida"
            class="tipo-btn"
            onclick="selecionarTipo('saida')"
          >
            <i class="fa-solid fa-arrow-up"></i> Saída
          </button>
        </div>

        <div class="modal-body">
          <div class="form-group">
            <label for="input-matricula">Matrícula</label>
            <input type="text" id="input-matricula" placeholder="Ex: 2024001" />
          </div>

          <div class="form-group">
            <label for="input-placa">Placa</label>
            <input
              type="text"
              id="input-placa"
              placeholder="Ex: ABC-1234"
              style="text-transform: uppercase"
            />
          </div>

          <div class="form-group">
            <label>Foto da placa</label>
            <div
              id="upload-area"
              class="upload-area"
              onclick="document.getElementById('input-foto').click()"
            >
              <i class="fa-solid fa-camera"></i>
              <p>Clique para adicionar foto</p>
              <span>JPG, PNG até 5MB</span>
            </div>
            <input
              type="file"
              id="input-foto"
              accept="image/*"
              style="display: none"
              onchange="previewFoto(this)"
            />
            <div
              id="preview-container"
              class="preview-container"
              style="display: none"
            >
              <img id="preview-img" alt="Preview da placa" />
              <button class="remove-foto" onclick="removerFoto()">
                <i class="fa-solid fa-trash"></i> Remover foto
              </button>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
          <button class="btn-registrar" onclick="registrarMovimentacao()">
            <i class="fa-solid fa-check"></i> Registrar
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="../js/components.js"></script>
    <script type="module" src="../js/entryexit.js"></script>
  </body>
</html>
