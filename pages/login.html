<!doctype html>
<html lang="pt-Br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/login.css" />
    <title>Login</title>
</head>

<body>
    <div class="container">
        <div class="left-panel">
            <div class="left-panel-logo">
                <div class="split-left">
                    <img src="https://ugb.edu.br/arquivossite/Portal/imgs/LogoHorizontal.png" title="UGB FERP"
                        alt="UGB FERP" />
                </div>

                <h1 class="banner-title">DiBiase Estaciona</h1>
                <p class="banner-subtitle">Gestão inteligente e digital do estacionamento</p>
            </div>
        </div>

        <div class="right-panel">
            <div class="auth-container-right">
                <form>
                    <div class="auth-title">
                        <h2>Entrar na sua conta</h2>
                        <p>Informe sua matrícula e senha para continuar.</p>
                    </div>

                    <div class="form-box">
                        <div class="form-group">
                            <label class="control-label" for="loginMatricula">Matricula</label>
                            <input type="text" class="form-control custom-input" name="loginMatricula"
                                placeholder="Digite sua matrícula" id="loginMatricula">
                        </div>

                        <div class="form-group">
                            <label class="control-label" for="loginSenha">Senha</label>
                            <input type="password" class="form-control custom-input" name="loginSenha"
                                placeholder="Digite sua senha" id="loginSenha">
                        </div>

                        <p id="erro-login" style="display:none; color:#e74c3c; font-size:20px; text-align:center;">
                            Matrícula ou senha incorretos.
                        </p>

                        <div class="box-footer">
                            <button type="submit" class="btnLogin">Entrar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
</body>

</html>
